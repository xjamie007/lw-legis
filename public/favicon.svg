<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="LW LEGIS">
  <!--
    Das Wappen der Kanzlei: Messing auf Dunkelgrund, wie das Schild an der
    avenue du X Septembre. Keine Verlaeufe, keine Schatten.
    Farben: encre #151E1A, laiton aufgehellt #AB8440 (4,95:1 gegen encre).
  -->
  <rect width="32" height="32" fill="#151E1A"/>
  <rect x="3" y="3" width="26" height="26" fill="none" stroke="#AB8440" stroke-width="1"/>
  <text x="16" y="21"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13" font-weight="600" letter-spacing="0.5"
        text-anchor="middle" fill="#AB8440">LW</text>
</svg>
