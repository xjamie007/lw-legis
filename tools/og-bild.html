<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:'Literata';src:url('../public/fonts/literata-roman-latin.woff2') format('woff2');font-weight:400 700;font-display:block}
@font-face{font-family:'Atk';src:url('../public/fonts/atkinson-hyperlegible-next-roman-latin.woff2') format('woff2');font-weight:400 700;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
html{width:1000px;height:1000px;overflow:hidden;background:#EEF0EA}
body{width:1000px;height:1000px;display:flex;align-items:center;overflow:hidden}
.carte{background:#EEF0EA;font-family:'Literata',Georgia,serif;color:#151E1A;width:1000px;height:525px;display:flex;flex-direction:column;justify-content:space-between;padding:58px 66px}
.haut{display:flex;align-items:baseline;gap:18px}
.marque{font-size:25px;font-weight:600;letter-spacing:.14em}
.sous{font-family:'Atk',sans-serif;font-size:16px;color:#4F554F}
.phrase{font-size:47px;font-weight:600;line-height:1.17;letter-spacing:-.02em;max-width:17ch}
.f{color:#2F5D50;text-decoration:underline;text-decoration-thickness:2.5px;text-underline-offset:7px}
.bas{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;border-top:1.7px solid #A07C3C;padding-top:18px}
.pied{font-family:'Atk',sans-serif;font-size:16.5px;color:#4F554F;line-height:1.5}
.tel{font-family:'Atk',sans-serif;font-size:18px;color:#2F5D50;white-space:nowrap}
</style></head><body>
<div class="carte">
<div class="haut"><span class="marque">LW LEGIS</span><span class="sous">Étude d’Avocats, Luxembourg</span></div>
<p class="phrase">Vous êtes <span class="f">en France</span> et vous souhaitez, au Luxembourg, <span class="f">acheter un bien</span>.</p>
<div class="bas"><p class="pied">Au barreau de Luxembourg depuis 1982.<br>41, avenue du X Septembre, L-2551 Luxembourg</p><p class="tel">+352 44 71 76-1</p></div>
</div>
</body></html>
